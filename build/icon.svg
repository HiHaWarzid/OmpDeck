<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0.8" y2="1.2">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Rounded-square background -->
  <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#bg-grad)"/>

  <!-- π symbol — horizontal bar (18px thick for small-size clarity) -->
  <rect x="22" y="28" width="76" height="18" rx="3" fill="#ffffff"/>

  <!-- π symbol — left leg -->
  <rect x="32" y="46" width="18" height="48" rx="3" fill="#ffffff"/>

  <!-- π symbol — right leg (shorter) -->
  <rect x="70" y="46" width="18" height="30" rx="3" fill="#ffffff"/>

  <!-- Plugin connector (orange) -->
  <rect x="62" y="70" width="30" height="24" rx="5" fill="url(#orange-grad)"/>

  <!-- USB plug detail inside connector -->
  <rect x="68" y="76" width="5" height="12" rx="1.5" fill="#0f172a"/>
  <rect x="81" y="76" width="5" height="12" rx="1.5" fill="#0f172a"/>
</svg>
