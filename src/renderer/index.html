<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#111315" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OmpDeck" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https://cloudcache.tencent-cloud.com https://skillhub-1388575217.cos.accelerate.myqcloud.com; font-src 'self' data:; connect-src 'self' ws: http://127.0.0.1:* http://localhost:* https://api.skillhub.cn"
    />
    <title></title>
    <link rel="preload" href="./src/assets/fonts/PlantinNowVariable-Upright.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./src/assets/fonts/PlantinNowVariable-Italic.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* 启动画面：独立于 #root，React 挂载后淡出移除。
         唯一启动画面：主进程不再有前置 data URL loading 页（曾因跨文档导航
         整页替换造成闪烁），窗口由 ready-to-show 门控显示，出现时本页已渲染完成。 */

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
        background: #eef0f3;
      }

      #boot-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(1200px 600px at 50% 28%, rgba(26, 158, 60, 0.10), transparent 62%),
          linear-gradient(180deg, #f5f6f3 0%, #eef0f3 55%, #e9ebe7 100%);
        transition: opacity 420ms cubic-bezier(0.22, 1, 0.36, 1), transform 420ms cubic-bezier(0.22, 1, 0.36, 1);
        will-change: opacity, transform;
      }
      #boot-overlay.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: min(720px, calc(100vw - 48px));
        padding: 0 16px;
      }

      /* 启动 logo SVG：无绿底方块，均 tray 图标风格 */
      .boot-logo-svg {
        width: 148px;
        height: 148px;
        display: block;
        filter: drop-shadow(0 12px 28px rgba(15, 23, 42, 0.14));
      }

      /* 与空状态 empty-tagline 同族：品牌衬线、大字、紧字距 */
      .boot-title {
        color: #202124;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(42px, 6vw, 64px);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.08;
        text-align: center;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      /* 与 empty-subtitle 同族：同衬线、次级灰度、更大行距 */
      .boot-subtitle {
        color: #5f6368;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(17px, 1.8vw, 22px);
        font-weight: 500;
        letter-spacing: 0;
        line-height: 1.55;
        text-align: center;
        text-wrap: balance;
        -webkit-font-smoothing: antialiased;
      }

      .boot-progress {
        width: 120px;
        height: 3px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        overflow: hidden;
      }
      .boot-progress-bar {
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #1a9e3c, #22c55e);
        animation: boot-progress 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(280%);
        }
      }

      .boot-retry {
        margin-top: 4px;
        padding: 8px 18px;
        border: 1px solid rgba(15, 23, 42, 0.18);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.7);
        color: #202124;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .boot-retry:hover {
        background: #fff;
      }
      .boot-retry:focus-visible {
        outline: 2px solid #22c55e;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        .boot-retry {
          border-color: rgba(255, 255, 255, 0.2);
          background: rgba(255, 255, 255, 0.08);
          color: #eceff3;
        }
        .boot-retry:hover {
          background: rgba(255, 255, 255, 0.14);
        }
      }

      @media (prefers-color-scheme: dark) {
        html, body {
          background: #111315;
        }
        #boot-overlay {
          background:
            radial-gradient(1000px 520px at 50% 30%, rgba(34, 197, 94, 0.12), transparent 60%),
            linear-gradient(180deg, #15181b 0%, #111315 100%);
        }
        .boot-title {
          color: #eceff3;
        }
        .boot-subtitle {
          color: #b9c0c8;
        }
        .boot-progress {
          background: rgba(255, 255, 255, 0.08);
        }
        .boot-logo-canvas {
          filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.35));
        }
        .boot-logo-svg {
          color: #eceff3 !important;
          --boot-notch-bg: #111315;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-brand,
        .boot-progress,
        .boot-progress-bar {
          animation: none !important;
        }
        /* 动画被禁用时进度条不应静止在 42% 中间像卡死：
           改为满轨淡色条，保留“正在加载”语义但不暗示进度停滞。 */
        .boot-progress-bar {
          width: 100%;
          background: linear-gradient(
            90deg,
            rgba(26, 158, 60, 0.3),
            rgba(34, 197, 94, 0.3)
          );
        }
        #boot-overlay {
          transition-duration: 120ms;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动画面覆盖层：React 挂载后通过 fade-out 动画淡出再移除 -->
    <div id="boot-overlay">
      <div class="boot-brand">
        <svg viewBox="0 0 120 120" width="148" height="148" aria-hidden="true" class="boot-logo-svg" style="color: #000">
          <rect x="22" y="30" width="76" height="12" rx="2" fill="currentColor"/>
          <rect x="34" y="42" width="12" height="52" rx="2" fill="currentColor"/>
          <rect x="74" y="42" width="12" height="32" rx="2" fill="currentColor"/>
          <rect x="64" y="68" width="28" height="22" rx="4" fill="#ff8c00"/>
          <rect x="69" y="74" width="4" height="10" rx="1" fill="var(--boot-notch-bg, #fff)"/>
          <rect x="83" y="74" width="4" height="10" rx="1" fill="var(--boot-notch-bg, #fff)"/>
        </svg>
        <strong class="boot-title">OmpDeck</strong>
        <span class="boot-subtitle">正在启动工作台…</span>
      </div>
      <div class="boot-progress" aria-hidden="true">
        <div class="boot-progress-bar"></div>
      </div>
    </div>
    <noscript>
      <div style="position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;background:#eef0f3;color:#202124;font:16px/1.6 Georgia,serif;padding:24px;text-align:center">
        OmpDeck 需要启用 JavaScript 才能启动。
      </div>
    </noscript>
    <!-- 启动诊断必须先于主模块执行，弱网/脚本失败时才能给出提示。 -->
    <script src="./boot-diagnostics.js"></script>
    <!-- React 挂载 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
